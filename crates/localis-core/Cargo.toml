[package]
name = "localis-core"
description = "Localis domain logic and SQLite persistence (no Tauri dependency)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
lopdf = { version = "0.47", default-features = false }
zip = { version = "9.7", default-features = false, features = ["deflate-flate2"] }
quick-xml = "0.42"
imagesize = { version = "0.15", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde_json = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
keyring = { version = "4.2", default-features = false, features = ["v1"] }

[dev-dependencies]
tempfile = "3"
